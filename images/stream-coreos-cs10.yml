mode: disabled
arches:
- x86_64
content:
  source:
    dockerfile: Containerfile
    git:
      branch:
        target: release-{MAJOR}.{MINOR}
      url: git@github.com:openshift-priv/os.git
      web: https://github.com/openshift/os
    ci_alignment:
      streams_prs:
        enabled: false
      mirror: false
    modifications:
    - action: replace
      match: "ARG OPENSHIFT_VERSION=overridden"
      replacement: "ARG OPENSHIFT_VERSION=5.0"
    - action: replace
      match: "ARG IMAGE_NAME"
      replacement: "ARG IMAGE_NAME="
    - action: replace
      match: "ARG IMAGE_CPE"
      replacement: "ARG IMAGE_CPE="
    - action: replace
      match: "ARG TARGETARCH"
      replacement: "ARG TARGETARCH=amd64"
    - action: replace
      match: "ARG STREAM_CLASS"
      replacement: "ARG STREAM_CLASS=centos-10"
    - action: replace
      match: "LABEL name=${IMAGE_NAME}"
      replacement: ""
    - action: replace
      match: "LABEL architecture=${TARGETARCH}"
      replacement: ""
    - action: replace
      match: 'RUN --mount=type=bind,target=/run/src --mount=type=secret,id=yumrepos,target=/run/src/secret.repo /run/src/build-node-image.sh'
      replacement: |
        COPY build-node-image.sh /tmp/art-build-node-image.sh
        RUN --mount=type=bind,target=/run/src --mount=type=secret,id=yumrepos,target=/run/src/secret.repo \
            sed -i \
                -e 's/dnf --repo="${YUM_REPO_NAMES}"/dnf --disablerepo=c10s-sig-virtualization/' \
                -e '/^# XXX: For SCOS, only allow certain packages/,/^fi$/d' \
                /tmp/art-build-node-image.sh && \
            bash /tmp/art-build-node-image.sh && \
            rm -f /tmp/art-build-node-image.sh
distgit:
  branch: rhaos-{MAJOR}.{MINOR}-rhel-10
  component: stream-coreos-cs10-container
for_payload: false
for_release: false
from:
  stream: stream_coreos_10
name: openshift/stream-coreos
owners:
- aos-team-art@redhat.com
canonical_builders_from_upstream: false
okd:
  mode: enabled
